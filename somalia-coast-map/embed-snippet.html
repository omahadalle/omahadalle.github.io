<!--
  Somalia coastal locations: embed snippet
  Paste this into any page of your site (HTML page, or a Markdown page on GitHub Pages).
  It shows only the map's title bar; clicking the eye opens the map, and the frame grows to fit.

  • src             where the somalia-coast-map folder lives on your site
  • data-open-height how tall the frame is when the map is open (pixels)
-->
<iframe
  src="/somalia-coast-map/"
  data-open-height="650"
  title="Somalia coastal locations"
  loading="lazy"
  style="width:100%; height:72px; border:0; display:block; transition:height .3s ease"></iframe>
<script>
  // Resizes the map frame when the eye is clicked (or search results / About box open).
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.type !== "somalia-coast-map") return;
    var frames = document.querySelectorAll("iframe[data-open-height]");
    for (var i = 0; i < frames.length; i++) {
      if (frames[i].contentWindow !== e.source) continue;
      var open = parseInt(frames[i].getAttribute("data-open-height"), 10) || 650;
      frames[i].style.height = (d.shown ? Math.max(open, d.height) : d.height) + "px";
    }
  });
</script>
